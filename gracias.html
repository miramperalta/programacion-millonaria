<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ya tienes tu lugar · Programación millonaria</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600&family=Fraunces:ital,wght@1,400&display=swap" rel="stylesheet">
<style>
:root{--tinta:#15120F;--tinta2:#1E1A16;--rosa:#F6B9CB;--mante:#F6E3A3;--verde:#79E6A1;--linea:rgba(255,255,255,.14);--suave:rgba(255,255,255,.72)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--tinta);color:#fff;font-family:Figtree,system-ui,sans-serif;font-size:18px;line-height:1.55;min-height:100vh;display:flex;align-items:center}
.caja{max-width:680px;margin:0 auto;padding:56px 20px;text-align:center}
.mono{font-family:"DM Mono",monospace;letter-spacing:.16em;text-transform:uppercase;font-size:13px}
.paso{display:inline-block;border:2px dashed var(--mante);color:var(--mante);padding:8px 14px;margin-bottom:26px}
h1{font-family:Anton,sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(46px,9vw,84px);line-height:.95}
h1 + .cal{font-family:Fraunces,serif;font-style:italic;font-size:clamp(34px,7vw,60px);color:var(--rosa);margin:4px 0 22px}
p{color:var(--suave);margin-bottom:28px}
p b{color:#fff}
.boton{display:flex;justify-content:center;align-items:center;width:100%;max-width:460px;margin:0 auto 14px;background:var(--verde);color:var(--tinta);border-radius:14px;padding:19px 22px;font-family:"DM Mono",monospace;font-weight:500;font-size:15px;letter-spacing:.14em;text-transform:uppercase;text-decoration:none}
.boton.sec{background:transparent;color:#fff;border:1px solid var(--linea)}
.datos{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:30px 0 0}
.datos span{border:1px solid var(--linea);border-radius:999px;padding:8px 16px}
</style>
</head>
<body>
<div class="caja">
  <div class="mono paso">Falta un paso</div>
  <h1 id="saludo">Ya tienes tu lugar</h1>
  <div class="cal">en Programación millonaria</div>
  <p>El acceso de Zoom lo mando <b>en el grupo de WhatsApp</b> de la clase. Entra ahora para no perderlo: ahí también van los recordatorios.</p>
  <a class="boton" id="grupo" href="#" target="_blank" rel="noopener">Entrar al grupo de WhatsApp</a>
  <a class="boton sec" id="calendario" href="#" target="_blank" rel="noopener">Agregar a mi calendario</a>
  <div class="datos mono"><span>Domingo 29 nov</span><span>6:00 pm México</span><span>7:00 pm Colombia</span></div>
</div>
<script>
const CONFIG = {
  // Comunidad de Miriam (20-nov-2026)
  WHATSAPP_GRUPO: 'https://chat.whatsapp.com/LK7sLhyW5545xplSiDAhOg'
};
document.getElementById('grupo').href = CONFIG.WHATSAPP_GRUPO;
document.getElementById('calendario').href = 'https://calendar.google.com/calendar/render?action=TEMPLATE'
  + '&text=' + encodeURIComponent('Programación millonaria · Masterclass con Miriam Peralta')
  + '&dates=20261130T000000Z/20261130T013000Z'
  + '&details=' + encodeURIComponent('El acceso de Zoom llega al grupo de WhatsApp de la clase.');
try{ const n = sessionStorage.getItem('pm_nombre'); if(n) document.getElementById('saludo').textContent = n.split(' ')[0] + ', ya tienes tu lugar'; }catch(e){}
</script>
</body>
</html>
